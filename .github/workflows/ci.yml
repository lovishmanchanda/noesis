name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Markdown links
        run: node scripts/check-links.mjs
      - name: Check the pipeline schema is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('packages/schema/pipeline.schema.json','utf8'))"
