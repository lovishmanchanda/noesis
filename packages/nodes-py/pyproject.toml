[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noesis-nodes"
version = "0.0.0"
description = "Plain pandas and scikit-learn functions, one per NOESIS pipeline step"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "xgboost",
  "pyarrow",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
